[package]
name = "db-schema-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
rmcp = { version = "3", features = ["macros", "server", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = "0.7"
tokio-util = "0.7"
